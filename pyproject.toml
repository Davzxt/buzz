[project]
name = "prototype-memory-research"
version = "0.1.0"
description = "Experimental core for hypothesis H1: fixed sparse encoder with additive prototype memory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
